<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>CSV Editor</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20viewBox=%220%200%2064%2064%22%3E%3Crect%20width=%2264%22%20height=%2264%22%20rx=%2214%22%20fill=%22%231a73e8%22/%3E%3Crect%20x=%2211%22%20y=%2213%22%20width=%2242%22%20height=%2238%22%20rx=%224%22%20fill=%22%23fff%22/%3E%3Cpath%20d=%22M11%2017a4%204%200%200%201%204-4h34a4%204%200%200%201%204%204v7H11z%22%20fill=%22%23bcd3f7%22/%3E%3Cpath%20d=%22M11%2024h42M11%2033h42M11%2042h42M25%2013v38M39%2013v38%22%20fill=%22none%22%20stroke=%22%231a73e8%22%20stroke-width=%222.6%22/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header id="toolbar">
      <div class="menu">
        <button id="menu-button" aria-haspopup="menu" aria-expanded="false">
          <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M2 3.8h12M2 8h12M2 12.2h12" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" /></svg>
          Menu
        </button>
        <ul id="menu-list" class="popup-menu" role="menu" hidden>
          <li role="menuitem" data-action="new">New</li>
          <li role="menuitem" data-action="open">Open…</li>
          <li role="menuitem" data-action="save">Save<kbd>Ctrl+S</kbd></li>
          <li role="menuitem" data-action="save-as">Save As…</li>
          <li role="menuitem" data-action="format">File Format…</li>
          <li role="separator" class="separator"></li>
          <li role="menuitem" data-action="split-side">Split Side by Side</li>
          <li role="menuitem" data-action="split-stacked">Split Top and Bottom</li>
          <li role="menuitem" data-action="single-view">Single View</li>
          <li role="separator" class="separator"></li>
          <li role="menuitem" data-action="undo">Undo<kbd>Ctrl+Z</kbd></li>
          <li role="menuitem" data-action="redo">Redo<kbd>Ctrl+Y</kbd></li>
          <li role="separator" class="separator"></li>
          <li role="menuitem" data-action="find">Find…<kbd>Ctrl+F</kbd></li>
          <li role="menuitem" data-action="clear-filters">Clear all filters</li>
          <li role="separator" class="separator"></li>
          <li role="menuitemcheckbox" aria-checked="false" data-action="dark-mode" data-keep-open>Dark Mode<span class="switch" aria-hidden="true"></span></li>
        </ul>
      </div>
      <div id="tabs"></div>
      <div id="tabs-right" hidden></div>
    </header>
    <main id="panes"></main>
    <template id="pane-template">
      <section class="pane">
        <div class="pane-warnings" hidden></div>
        <div class="pane-body">
          <div class="pane-empty">
            <div class="empty-card">
              <svg class="empty-icon" viewBox="0 0 48 48" width="56" height="56" aria-hidden="true">
                <rect x="6" y="9" width="36" height="30" rx="3" fill="none" stroke="currentColor" stroke-width="2.5" />
                <path d="M6 18h36M6 28h36M19 9v30M31 9v30" fill="none" stroke="currentColor" stroke-width="2.5" />
              </svg>
              <h1>Open a CSV file</h1>
              <p>Drop one or more <b>.csv</b> files anywhere in this window, or choose them yourself.</p>
              <div class="empty-actions">
                <button class="primary-button empty-open">Open file…</button>
                <button class="secondary-button empty-new">New blank document</button>
              </div>
              <dl class="empty-keys">
                <div><dt><kbd>Ctrl</kbd> <kbd>S</kbd></dt><dd>Save</dd></div>
                <div><dt><kbd>Ctrl</kbd> <kbd>F</kbd></dt><dd>Find and replace</dd></div>
                <div><dt><kbd>Ctrl</kbd> <kbd>Z</kbd> / <kbd>Y</kbd></dt><dd>Undo / redo</dd></div>
                <div><dt><kbd>Ctrl</kbd> <kbd>C</kbd> / <kbd>V</kbd></dt><dd>Copy / paste</dd></div>
                <div><dt><kbd>F2</kbd></dt><dd>Edit a cell</dd></div>
              </dl>
              <p class="empty-hint">The encoding and the delimiter are detected for you. Your files stay on this computer.</p>
            </div>
          </div>
        </div>
      </section>
    </template>
    <div id="drop-overlay" hidden><div>Drop a CSV file to open it</div></div>
    <footer id="status"><span id="status-activity"></span><span id="status-info"></span></footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
